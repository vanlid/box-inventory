# Push a tag like v1.2.0 to publish a release with the download bundles the one-line installers use.
# The matching Docker image is built by image.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build download bundles
        run: |
          mkdir -p dist/box-inventory
          git archive HEAD | tar -x -C dist/box-inventory
          rm -rf dist/box-inventory/.github
          echo "${GITHUB_REF_NAME}" > dist/box-inventory/VERSION
          cd dist
          tar -czf box-inventory.tar.gz box-inventory
          zip -qr box-inventory.zip box-inventory
          sed "s#ghcr.io/vanlid/box-inventory#ghcr.io/${GITHUB_REPOSITORY,,}#" ../compose.image.yaml > docker-compose.yml
          cp ../.env.example env.example
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/box-inventory.tar.gz dist/box-inventory.zip dist/docker-compose.yml dist/env.example install.sh install.ps1

