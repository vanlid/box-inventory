# Push a tag like v1.2.0 to publish a release with the download bundles the one-line installers use.
# The matching Docker image is built by image.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build download bundles
        run: |
          mkdir -p dist/box-inventory
          git archive HEAD | tar -x -C dist/box-inventory
          rm -rf dist/box-inventory/.github
          echo "${GITHUB_REF_NAME}" > dist/box-inventory/VERSION
          cd dist
          tar -czf box-inventory.tar.gz box-inventory
          zip -qr box-inventory.zip box-inventory
          sed "s#ghcr.io/vanlid/box-inventory#ghcr.io/${GITHUB_REPOSITORY,,}#" ../compose.image.yaml > compose.yaml
          cp ../compose.tailscale.yaml ../compose.ollama.yaml .
          cp ../.env.example env.example
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/box-inventory.tar.gz dist/box-inventory.zip dist/compose.yaml dist/compose.tailscale.yaml dist/compose.ollama.yaml dist/env.example install.sh install.ps1

